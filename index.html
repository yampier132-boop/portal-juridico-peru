<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portal jurídico peruano</title>
  <style>
    :root {
      color-scheme: dark;
      --fondo: #000;
      --texto: #f5f5f5;
      --suave: #a1a1aa;
      --borde: #27272a;
      --acento: #34d399;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--fondo);
      color: var(--texto);
      font-family: system-ui, sans-serif;
    }

    header, main, footer {
      width: min(100% - 40px, 960px);
      margin-inline: auto;
    }

    header {
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--borde);
    }

    .marca { font-weight: 600; letter-spacing: -0.03em; }
    .pais { color: var(--suave); font-size: 0.9rem; }

    main { padding-block: clamp(88px, 16vw, 160px); }

    .etiqueta {
      color: var(--acento);
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 720px;
      margin: 20px 0;
      font-size: clamp(2.7rem, 8vw, 5.5rem);
      letter-spacing: -0.065em;
      line-height: 1.02;
    }

    .descripcion {
      max-width: 580px;
      color: var(--suave);
      font-size: clamp(1.05rem, 2vw, 1.25rem);
      line-height: 1.7;
    }

    footer {
      padding-block: 24px;
      border-top: 1px solid var(--borde);
      color: var(--suave);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <header>
    <div class="marca">Portal jurídico</div>
    <div class="pais">Perú</div>
  </header>

  <main>
    <p class="etiqueta">Un proyecto en construcción</p>
    <h1>Derecho peruano, con claridad.</h1>
    <p class="descripcion">
      Actualidad, análisis y recursos para la comunidad jurídica del Perú.
      Este espacio crecerá paso a paso.
    </p>
  </main>

  <footer>Primera versión · Contenido próximamente</footer>
</body>
</html>
